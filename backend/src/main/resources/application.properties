spring.application.name=demo

# Local credentials live in backend/.env (git-ignored); real env vars override them
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=demotesting;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:demo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
