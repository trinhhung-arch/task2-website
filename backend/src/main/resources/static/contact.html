<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | SMS</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main class="wrap" hidden>
    <div class="page-head">
      <div>
        <p class="kicker">Get in touch</p>
        <h1>We&rsquo;d love to hear from you.</h1>
        <p class="muted">Reach out by email or phone, or find us in Hanoi.</p>
      </div>
    </div>

    <div class="contact">
      <section class="card">
        <dl>
          <dt>Email</dt>
          <dd><a href="mailto:hello@example.com">hello@example.com</a></dd>
          <dt>Phone</dt>
          <dd><a href="tel:+84777777777">+84 777777777</a></dd>
          <dt>Address</dt>
          <dd>Hanoi, Vietnam</dd>
        </dl>
        <p class="note">For general questions, email us at <a href="mailto:hello@example.com">hello@example.com</a>.</p>
      </section>

      <section class="card map">
        <iframe title="Map of Hanoi, Vietnam" loading="lazy"
          src="https://www.openstreetmap.org/export/embed.html?bbox=105.70%2C20.93%2C106.00%2C21.13&amp;layer=mapnik&amp;marker=21.0285%2C105.8542"></iframe>
      </section>
    </div>
  </main>

  <script src="/js/page.js"></script>
  <script>requireUser();</script>
</body>
</html>
